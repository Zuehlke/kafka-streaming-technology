apiVersion: apps/v1
kind: Deployment
metadata:
  name: sensor
  namespace: kafka
  labels:
    app: sensor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sensor
  template:
    metadata:
      labels:
        app: sensor
    spec:
      enableServiceLinks: false
      containers:
        - name: sensor
          image: ghcr.io/zuehlke/kafka-streaming-technology/sensor-kraft:latest
          imagePullPolicy: Always
          env:
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: kafka-demo-kafka-bootstrap:9092
            - name: SPRING_KAFKA_PROPERTIES_SCHEMA_REGISTRY_URL
              value: http://schema-registry:8081
            - name: SENSOR_SENSOR_ID
              value: mySensor
            - name: SENSOR_PLANT_ID
              value: myPlant
            - name: SENSOR_MIN_VALUE
              value: "1"
            - name: SENSOR_MAX_VALUE
              value: "1000000"
          resources:
            requests:
              memory: 256Mi
              cpu: 50m
            limits:
              memory: 512Mi
              cpu: 300m
